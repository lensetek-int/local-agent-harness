<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lensetek Agent Workspace</title>
  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --bg-hover: #E2E8F0;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF;
      --accent-text: #1E40AF;
      --success: #059669;
      --success-soft: #ECFDF5;
      --warn: #D97706;
      --warn-soft: #FFFBEB;
      --danger: #DC2626;
      --danger-soft: #FEF2F2;
      --code-bg: #F8FAFC;
      --code-border: #E2E8F0;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html[data-theme="dark"] {
      --bg-canvas: #0F1117;
      --bg-surface: #161922;
      --bg-subtle: #1E222E;
      --bg-hover: #282D3D;
      --border: #262B38;
      --border-strong: #363D50;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent: #3B82F6;
      --accent-hover: #60A5FA;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --accent-text: #93C5FD;
      --success: #10B981;
      --success-soft: rgba(16, 185, 129, 0.14);
      --warn: #F59E0B;
      --warn-soft: rgba(245, 158, 11, 0.14);
      --danger: #EF4444;
      --danger-soft: rgba(239, 68, 68, 0.14);
      --code-bg: #12151E;
      --code-border: #262B38;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font-sans); background: var(--bg-canvas); color: var(--text-primary); -webkit-font-smoothing: antialiased; }

    /* Mobile-First Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* Top Header */
    .topbar {
      height: 52px;
      min-height: 52px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
      z-index: 30;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-right { display: flex; align-items: center; gap: 6px; }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      font-size: 16px;
    }
    .icon-btn:hover { background: var(--bg-subtle); color: var(--text-primary); }
    .icon-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(37, 99, 235, 0.2); }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand-mark {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.28);
    }
    .workspace-pill {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .dot.online { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    .dot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .select-pill {
      height: 30px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 12px;
      font-family: var(--font-sans);
      cursor: pointer;
      outline: none;
      max-width: 145px;
    }
    .select-pill:focus { border-color: var(--accent); }
    .desktop-only { display: none; }

    /* Main Body Workspace */
    .workspace-body {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    /* Sidebar (Mobile Drawer -> Desktop Left Pane) */
    .sidebar {
      position: fixed;
      top: 52px;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-md);
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 52px 0 0 0;
      background: rgba(15, 23, 42, 0.32);
      backdrop-filter: blur(2px);
      z-index: 35;
    }
    .sidebar-backdrop.show { display: block; }

    .seg-tabs {
      display: flex;
      padding: 8px 10px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-canvas);
    }
    .seg-tab {
      flex: 1;
      padding: 6px 8px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .seg-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .sidebar-content { flex: 1; overflow-y: auto; padding: 8px; }
    .tree-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      margin-bottom: 6px;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      overflow-x: auto;
      white-space: nowrap;
    }
    .breadcrumb-link { cursor: pointer; color: var(--accent); font-weight: 500; }
    .breadcrumb-link:hover { text-decoration: underline; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-primary);
      transition: background 0.12s;
      user-select: none;
    }
    .file-item:hover { background: var(--bg-subtle); }
    .file-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
    .file-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

    .session-card {
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.12s;
    }
    .session-card:hover { background: var(--bg-subtle); }
    .session-card.active { background: var(--accent-soft); border-color: rgba(37, 99, 235, 0.25); }
    .session-title { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .sidebar-controls {
      padding: 10px;
      border-top: 1px solid var(--border);
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-secondary); }

    /* Center Agent Chat Pane */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-canvas);
    }

    .chat-subbar {
      padding: 8px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .subbar-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .token-pill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      padding: 3px 8px;
      background: var(--bg-subtle);
      border-radius: 999px;
    }

    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .messages-inner {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Empty Welcome State */
    .welcome-card {
      margin: 24px auto;
      max-width: 560px;
      text-align: center;
      padding: 28px 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .welcome-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.02em; }
    .welcome-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; }
    .quick-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .chip-btn {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    /* Message Cards (Codex / Antigravity Style) */
    .msg-user {
      align-self: flex-end;
      max-width: 88%;
      background: var(--accent);
      color: #FFFFFF;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: var(--shadow-sm);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-assistant {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      word-break: break-word;
    }
    .msg-role-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    /* Tool Call Execution Cards */
    .tool-group { display: flex; flex-direction: column; gap: 6px; }
    .tool-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      font-size: 12px;
    }
    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      background: var(--bg-subtle);
      gap: 8px;
    }
    .tool-header:hover { background: var(--bg-hover); }
    .tool-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tool-badge {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .tool-badge.running { background: var(--warn-soft); color: var(--warn); }
    .tool-badge.done { background: var(--success-soft); color: var(--success); }
    .tool-body {
      display: none;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--code-bg);
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      max-height: 240px;
      overflow-y: auto;
    }
    .tool-card.expanded .tool-body { display: block; }

    /* Interactive Approval Card */
    .approval-card {
      background: var(--warn-soft);
      border: 1px solid var(--warn);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .approval-title { font-size: 13px; font-weight: 600; color: var(--warn); display: flex; align-items: center; gap: 6px; }
    .approval-prompt { font-size: 12.5px; font-family: var(--font-mono); color: var(--text-primary); background: var(--bg-surface); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); white-space: pre-wrap; }
    .approval-actions { display: flex; gap: 8px; }

    .btn {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      background: var(--bg-surface);
      color: var(--text-primary);
    }
    .btn:hover { background: var(--bg-subtle); }
    .btn-primary { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #FFFFFF; border-color: var(--success); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(220, 38, 38, 0.3); }

    /* Markdown Code Blocks */
    .md-content p { margin-bottom: 8px; }
    .md-content p:last-child { margin-bottom: 0; }
    .md-content ul, .md-content ol { padding-left: 20px; margin-bottom: 8px; }
    .md-content code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--bg-subtle);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .code-wrap {
      margin: 10px 0;
      border: 1px solid var(--code-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--code-bg);
    }
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }
    .code-wrap pre {
      padding: 10px 12px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-primary);
    }

    /* Floating Composer */
    .composer-wrap {
      padding: 10px 12px 14px;
      background: linear-gradient(to top, var(--bg-canvas) 75%, transparent);
      position: relative;
    }
    .slash-menu {
      max-width: 820px;
      margin: 0 auto 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      max-height: 240px;
      overflow-y: auto;
      display: none;
      padding: 4px;
    }
    .slash-menu.open { display: block; }
    .slash-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12.5px;
    }
    .slash-item:hover, .slash-item.active { background: var(--accent-soft); }
    .slash-cmd { font-family: var(--font-mono); font-weight: 600; color: var(--accent-text); white-space: nowrap; }
    .slash-desc { flex: 1; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .slash-cat { font-size: 10px; font-weight: 600; color: var(--text-muted); background: var(--bg-subtle); padding: 2px 6px; border-radius: 999px; }
    .composer-box {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s;
    }
    .composer-box:focus-within { border-color: var(--accent); }
    .composer-input {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      min-height: 40px;
      max-height: 160px;
    }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .composer-hint { font-size: 11px; color: var(--text-muted); }

    /* Right Code Editor Pane (Full overlay on mobile -> Right split on desktop) */
    .editor-pane {
      position: fixed;
      inset: 52px 0 0 0;
      background: var(--bg-surface);
      z-index: 38;
      display: none;
      flex-direction: column;
    }
    .editor-pane.open { display: flex; }
    .editor-header {
      height: 44px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-canvas);
    }
    .editor-filepath {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .editor-textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 14px;
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.55;
      tab-size: 4;
    }

    .toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg-surface);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      z-index: 100;
      box-shadow: var(--shadow-md);
      display: none;
    }
    .toast.show { display: block; }

    /* Tablet & Desktop Responsive Breakpoints */
    @media (min-width: 900px) {
      .workspace-pill { display: inline-flex; }
      .desktop-only { display: inline-flex; }
      .mobile-menu-btn { display: none; }
      .sidebar-backdrop { display: none !important; }

      .sidebar {
        position: static;
        transform: none;
        box-shadow: none;
        width: 268px;
        min-width: 268px;
      }
      .sidebar.collapsed { display: none; }

      .editor-pane {
        position: static;
        width: 44%;
        min-width: 360px;
        max-width: 680px;
        border-left: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu-btn" id="btnMobileMenu" title="Explorer & Sessions" aria-label="Menu">☰</button>
        <button class="icon-btn desktop-only" id="btnToggleSidebar" title="Toggle Sidebar">◧</button>
        <div class="brand">
          <div class="brand-mark">L</div>
          <span>Lensetek</span>
        </div>
        <div class="workspace-pill" id="workspacePill" title="Workspace">📁 .</div>
      </div>

      <div class="topbar-right">
        <div class="status-badge" id="serverStatusBadge">
          <span class="dot" id="serverDot"></span>
          <span id="serverStatusText">Connecting...</span>
        </div>
        <button class="icon-btn" id="btnToggleEditor" title="Toggle Code Editor">{ }</button>
        <button class="icon-btn" id="btnThemeToggle" title="Switch Light/Dark Theme">◐</button>
      </div>
    </header>

    <!-- Main 3-Pane Workspace -->
    <div class="workspace-body">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <!-- Left Sidebar: File Explorer & Sessions -->
      <aside class="sidebar" id="sidebar">
        <div class="seg-tabs">
          <button class="seg-tab active" data-tab="files" id="tabFiles">Files</button>
          <button class="seg-tab" data-tab="sessions" id="tabSessions">Sessions</button>
        </div>

        <div class="sidebar-content" id="paneFiles">
          <div class="tree-header">
            <span>Project Explorer</span>
            <button class="icon-btn" id="btnRefreshFiles" style="width:24px;height:24px;font-size:12px;" title="Refresh">↻</button>
          </div>
          <div class="breadcrumb-bar" id="breadcrumbBar"></div>
          <div id="fileList"></div>
        </div>

        <div class="sidebar-content" id="paneSessions" style="display:none;">
          <div class="tree-header">
            <span>Conversations</span>
            <button class="btn btn-primary" id="btnNewSession" style="padding:3px 8px;font-size:11px;">+ New</button>
          </div>
          <div id="sessionsList"></div>
        </div>

        <div class="sidebar-controls">
          <div class="ctrl-row">
            <span>Safety</span>
            <select class="select-pill" id="selSafety">
              <option value="strict">Strict (Confirm)</option>
              <option value="auto-approve">Auto-Approve</option>
              <option value="yolo">YOLO</option>
            </select>
          </div>
          <div class="ctrl-row">
            <span>Effort</span>
            <select class="select-pill" id="selEffort">
              <option value="off">Off</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="ctrl-row">
            <span>Language</span>
            <select class="select-pill" id="selLanguage">
              <option value="en">English</option>
              <option value="id">Indonesia</option>
              <option value="cn">简体中文</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Center: Agent Conversation & Tool Execution -->
      <main class="chat-pane">
        <div class="chat-subbar">
          <div class="subbar-pills">
            <select class="select-pill" id="selModel" style="max-width:220px;" title="Active GGUF Model"></select>
            <span class="token-pill" id="tokenUsagePill">0 tok</span>
          </div>
          <button class="btn" id="btnClearView" style="padding:4px 10px;font-size:11.5px;">+ New Chat</button>
        </div>

        <div class="messages-scroll" id="messagesScroll">
          <div class="messages-inner" id="messagesInner">
            <div class="welcome-card" id="welcomeCard">
              <h2>Lensetek Local Agent</h2>
              <p>Read, write, and edit project files locally with real workspace tooling and full privacy.</p>
              <div class="quick-chips">
                <button class="chip-btn" data-prompt="List the files in this project and explain the architecture.">Analyze project</button>
                <button class="chip-btn" data-prompt="Check README.md and summarize what this repo does.">Summarize README</button>
                <button class="chip-btn" data-prompt="Inspect cli-agent/main.py and suggest improvements.">Inspect main.py</button>
              </div>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="slash-menu" id="slashMenu"></div>
          <div class="composer-box">
            <textarea class="composer-input" id="promptInput" rows="1" placeholder="Ask Lensetek, type / for commands, or @ to mention files..."></textarea>
            <div class="composer-footer">
              <span class="composer-hint">Type / for commands · @ to mention files · Enter to send</span>
              <button class="btn btn-primary" id="btnSend">Send ↑</button>
            </div>
          </div>
        </div>
      </main>

      <!-- Right: Live File Viewer / Code Editor -->
      <section class="editor-pane" id="editorPane">
        <div class="editor-header">
          <div class="editor-filepath" id="editorFilePath">No file selected</div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span id="editorDirty" style="display:none;font-size:11px;color:var(--warn);font-weight:600;">Unsaved</span>
            <button class="btn btn-primary" id="btnSaveFile" style="padding:4px 10px;font-size:12px;">Save</button>
            <button class="icon-btn" id="btnCloseEditor" title="Close Editor">✕</button>
          </div>
        </div>
        <textarea class="editor-textarea" id="editorTextarea" spellcheck="false" placeholder="Select a file from the Project Explorer to inspect or edit..."></textarea>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      currentDir: '',
      activeFile: null,
      originalContent: '',
      isBusy: false,
      theme: localStorage.getItem('lensetek_theme') || 'light',
    };

    const $ = (id) => document.getElementById(id);

    function showToast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function applyTheme(t) {
      state.theme = t;
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('lensetek_theme', t);
    }
    applyTheme(state.theme);

    $('btnThemeToggle').onclick = () => {
      applyTheme(state.theme === 'light' ? 'dark' : 'light');
    };

    // Sidebar Mobile Drawer & Desktop Toggle
    function closeMobileDrawer() {
      $('sidebar').classList.remove('open');
      $('sidebarBackdrop').classList.remove('show');
    }
    $('btnMobileMenu').onclick = () => {
      $('sidebar').classList.toggle('open');
      $('sidebarBackdrop').classList.toggle('show');
    };
    $('sidebarBackdrop').onclick = closeMobileDrawer;
    $('btnToggleSidebar').onclick = () => $('sidebar').classList.toggle('collapsed');

    // Sidebar Tabs
    $('tabFiles').onclick = () => {
      $('tabFiles').classList.add('active');
      $('tabSessions').classList.remove('active');
      $('paneFiles').style.display = '';
      $('paneSessions').style.display = 'none';
    };
    $('tabSessions').onclick = () => {
      $('tabSessions').classList.add('active');
      $('tabFiles').classList.remove('active');
      $('paneSessions').style.display = '';
      $('paneFiles').style.display = 'none';
    };

    // Editor Pane Toggles
    $('btnToggleEditor').onclick = () => $('editorPane').classList.toggle('open');
    $('btnCloseEditor').onclick = () => $('editorPane').classList.remove('open');

    // Lightweight Safe Markdown Renderer
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderMarkdown(text) {
      const parts = String(text || '').split(/```([\w-]*)\n?([\s\S]*?)```/g);
      let html = '';
      for (let i = 0; i < parts.length; i += 3) {
        let prose = escapeHtml(parts[i] || '');
        prose = prose.replace(/`([^`]+)`/g, '<code>$1</code>');
        prose = prose.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        prose = prose.replace(/\n/g, '<br>');
        if (prose) html += `<div class="md-content">${prose}</div>`;

        if (i + 2 < parts.length) {
          const lang = escapeHtml(parts[i + 1] || 'code');
          const code = escapeHtml(parts[i + 2] || '');
          const codeId = 'cb_' + Math.random().toString(36).slice(2, 9);
          html += `
            <div class="code-wrap">
              <div class="code-head">
                <span>${lang}</span>
                <button class="btn" style="padding:1px 7px;font-size:10.5px;" onclick="copyCode('${codeId}')">Copy</button>
              </div>
              <pre id="${codeId}">${code}</pre>
            </div>`;
        }
      }
      return html;
    }

    window.copyCode = (id) => {
      const el = $(id);
      if (!el) return;
      navigator.clipboard.writeText(el.textContent).then(() => showToast('Copied to clipboard'));
    };

    // Load Workspace State
    async function loadState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();

        $('workspacePill').textContent = '📁 ' + (data.workspace_name || '.');
        $('workspacePill').title = data.workspace || '';

        const dot = $('serverDot');
        const stTxt = $('serverStatusText');
        if (state.isBusy) {
          dot.className = 'dot busy';
          stTxt.textContent = 'Running...';
        } else if (data.server_healthy) {
          dot.className = 'dot online';
          stTxt.textContent = 'Ready';
        } else {
          dot.className = 'dot';
          stTxt.textContent = 'Standby';
        }

        // Populate Models
        const selModel = $('selModel');
        selModel.innerHTML = '';
        (data.models || []).forEach((m) => {
          const opt = document.createElement('option');
          opt.value = m.path;
          opt.textContent = `${m.name} (${m.size_mb} MB)`;
          if (m.name === data.model) opt.selected = true;
          selModel.appendChild(opt);
        });

        $('selSafety').value = data.safety_mode || 'strict';
        $('selEffort').value = data.effort || 'medium';
        $('selLanguage').value = data.language || 'en';

        const tok = (data.usage && data.usage.total_tokens) || 0;
        $('tokenUsagePill').textContent = `${tok} / ${data.ctx || 8192} tok`;

        renderSessions(data.sessions || [], data.active_session_id);
      } catch (e) {
        $('serverStatusText').textContent = 'Offline';
      }
    }

    function renderSessions(sessions, activeId) {
      const box = $('sessionsList');
      box.innerHTML = '';
      sessions.forEach((s) => {
        const div = document.createElement('div');
        div.className = 'session-card' + (s.id === activeId ? ' active' : '');
        div.innerHTML = `
          <div class="session-title">${escapeHtml(s.name || s.id)}</div>
          <div class="session-meta">${s.msg_count || 0} messages</div>
        `;
        div.onclick = async () => {
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'switch_session', session_id: s.id }),
          });
          await loadMessages();
          await loadState();
          closeMobileDrawer();
        };
        box.appendChild(div);
      });
    }

    async function loadFiles(dirPath = '') {
      state.currentDir = dirPath;
      const res = await fetch('/api/files?path=' + encodeURIComponent(dirPath));
      const data = await res.json();
      if (data.error) {
        showToast(data.error);
        return;
      }

      // Breadcrumbs
      const bc = $('breadcrumbBar');
      bc.innerHTML = `<span class="breadcrumb-link" onclick="loadFiles('')">root</span>`;
      if (dirPath) {
        const parts = dirPath.split('/');
        let acc = '';
        parts.forEach((p) => {
          acc = acc ? `${acc}/${p}` : p;
          const target = acc;
          bc.innerHTML += ` / <span class="breadcrumb-link" onclick="loadFiles('${target}')">${escapeHtml(p)}</span>`;
        });
      }

      const list = $('fileList');
      list.innerHTML = '';
      if (dirPath) {
        const parent = dirPath.split('/').slice(0, -1).join('/');
        const up = document.createElement('div');
        up.className = 'file-item';
        up.innerHTML = `<span class="file-icon">↩</span><span class="file-name">..</span>`;
        up.onclick = () => loadFiles(parent);
        list.appendChild(up);
      }

      (data.entries || []).forEach((item) => {
        const row = document.createElement('div');
        row.className = 'file-item' + (state.activeFile === item.path ? ' active' : '');
        const icon = item.is_dir ? '📁' : '📄';
        const size = item.is_dir ? '' : (item.size >= 1024 ? (item.size / 1024).toFixed(1) + ' KB' : item.size + ' B');
        row.innerHTML = `
          <span class="file-icon">${icon}</span>
          <span class="file-name">${escapeHtml(item.name)}</span>
          <span class="file-size">${size}</span>
        `;
        row.onclick = () => {
          if (item.is_dir) loadFiles(item.path);
          else openFile(item.path);
        };
        list.appendChild(row);
      });
    }

    async function openFile(filePath) {
      const res = await fetch('/api/file?path=' + encodeURIComponent(filePath));
      const data = await res.json();
      if (data.error) {
        showToast(data.error);
        return;
      }
      state.activeFile = data.path;
      state.originalContent = data.content;
      $('editorFilePath').textContent = data.path;
      $('editorTextarea').value = data.content;
      $('editorDirty').style.display = 'none';
      $('editorPane').classList.add('open');
      closeMobileDrawer();
      loadFiles(state.currentDir);
    }

    $('editorTextarea').addEventListener('input', () => {
      const dirty = $('editorTextarea').value !== state.originalContent;
      $('editorDirty').style.display = dirty ? 'inline' : 'none';
    });

    async function saveActiveFile() {
      if (!state.activeFile) return;
      const content = $('editorTextarea').value;
      const res = await fetch('/api/file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: state.activeFile, content }),
      });
      const data = await res.json();
      if (data.ok) {
        state.originalContent = content;
        $('editorDirty').style.display = 'none';
        showToast('Saved ' + state.activeFile);
      } else {
        showToast(data.error || 'Failed to save');
      }
    }
    $('btnSaveFile').onclick = saveActiveFile;
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('editorPane').classList.contains('open')) {
        e.preventDefault();
        saveActiveFile();
      }
    });

    $('btnRefreshFiles').onclick = () => loadFiles(state.currentDir);

    // Load Existing Session Messages
    async function loadMessages() {
      const res = await fetch('/api/session/messages');
      const data = await res.json();
      const inner = $('messagesInner');
      const msgs = data.messages || [];
      if (msgs.length === 0) {
        inner.innerHTML = '';
        inner.appendChild(createWelcomeCard());
        return;
      }
      inner.innerHTML = '';
      msgs.forEach((m) => {
        if (m.role === 'user') appendUserMessage(m.content);
        else if (m.role === 'assistant') appendAssistantMessage(m.content);
      });
      scrollToBottom();
    }

    function createWelcomeCard() {
      const div = document.createElement('div');
      div.className = 'welcome-card';
      div.id = 'welcomeCard';
      div.innerHTML = `
        <h2>Lensetek Local Agent</h2>
        <p>Read, write, and edit project files locally with real workspace tooling and full privacy.</p>
        <div class="quick-chips">
          <button class="chip-btn" onclick="sendQuickPrompt('List the files in this project and explain the architecture.')">Analyze project</button>
          <button class="chip-btn" onclick="sendQuickPrompt('Check README.md and summarize what this repo does.')">Summarize README</button>
          <button class="chip-btn" onclick="sendQuickPrompt('Inspect cli-agent/main.py and suggest improvements.')">Inspect main.py</button>
        </div>
      `;
      return div;
    }

    function scrollToBottom() {
      const el = $('messagesScroll');
      el.scrollTop = el.scrollHeight;
    }

    function appendUserMessage(text) {
      const wc = $('welcomeCard');
      if (wc) wc.remove();
      const div = document.createElement('div');
      div.className = 'msg-user';
      div.textContent = text;
      $('messagesInner').appendChild(div);
      scrollToBottom();
    }

    function appendAssistantMessage(content) {
      const div = document.createElement('div');
      div.className = 'msg-assistant';
      div.innerHTML = `
        <div class="msg-role-header"><span>Lensetek Agent</span></div>
        ${renderMarkdown(content)}
      `;
      $('messagesInner').appendChild(div);
      scrollToBottom();
    }

    window.sendQuickPrompt = (txt) => {
      $('promptInput').value = txt;
      sendPrompt();
    };

    document.querySelectorAll('.chip-btn').forEach((btn) => {
      btn.onclick = () => sendQuickPrompt(btn.dataset.prompt);
    });

    async function sendPrompt() {
      const input = $('promptInput');
      const prompt = input.value.trim();
      if (!prompt || state.isBusy) return;

      input.value = '';
      input.style.height = 'auto';
      state.isBusy = true;
      $('btnSend').disabled = true;
      loadState();

      appendUserMessage(prompt);

      const turnToolsBox = document.createElement('div');
      turnToolsBox.className = 'tool-group';
      $('messagesInner').appendChild(turnToolsBox);

      const statusLine = document.createElement('div');
      statusLine.style.cssText = 'font-size:12px;color:var(--text-muted);padding:2px 4px;';
      statusLine.textContent = 'Thinking...';
      turnToolsBox.appendChild(statusLine);
      scrollToBottom();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const { job_id, error } = await res.json();
        if (error || !job_id) throw new Error(error || 'Failed to start job');

        let nextIdx = 0;
        const toolCards = [];

        while (true) {
          const evRes = await fetch(`/api/events?job_id=${job_id}&after=${nextIdx}`);
          const evData = await evRes.json();
          nextIdx = evData.next_index;

          for (const ev of (evData.events || [])) {
            if (ev.type === 'status') {
              statusLine.textContent = ev.message;
            } else if (ev.type === 'tool_call') {
              const card = document.createElement('div');
              card.className = 'tool-card';
              const argPreview = JSON.stringify(ev.args || {}).slice(0, 80);
              card.innerHTML = `
                <div class="tool-header">
                  <span class="tool-title">⚙ ${escapeHtml(ev.name)}(${escapeHtml(argPreview)})</span>
                  <span class="tool-badge running">Running</span>
                </div>
                <div class="tool-body">Arguments:\n${escapeHtml(JSON.stringify(ev.args, null, 2))}</div>
              `;
              card.querySelector('.tool-header').onclick = () => card.classList.toggle('expanded');
              turnToolsBox.insertBefore(card, statusLine);
              toolCards.push(card);
            } else if (ev.type === 'tool_result') {
              const lastCard = toolCards[toolCards.length - 1];
              if (lastCard) {
                const badge = lastCard.querySelector('.tool-badge');
                badge.className = 'tool-badge done';
                badge.textContent = 'Done';
                lastCard.querySelector('.tool-body').textContent += `\n\nResult:\n${ev.result}`;
              }
              loadFiles(state.currentDir);
            } else if (ev.type === 'approval_required') {
              const appCard = document.createElement('div');
              appCard.className = 'approval-card';
              appCard.innerHTML = `
                <div class="approval-title">⚠ Permission Required</div>
                <div class="approval-prompt">${escapeHtml(ev.prompt)}</div>
                <div class="approval-actions">
                  <button class="btn btn-success" data-act="yes">Approve</button>
                  <button class="btn btn-danger" data-act="no">Deny</button>
                </div>
              `;
              appCard.querySelector('[data-act="yes"]').onclick = async () => {
                appCard.querySelector('.approval-actions').innerHTML = '<span style="font-size:12px;color:var(--success);font-weight:600;">✓ Approved</span>';
                await fetch('/api/approve', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ approval_id: ev.approval_id, approved: true }),
                });
              };
              appCard.querySelector('[data-act="no"]').onclick = async () => {
                appCard.querySelector('.approval-actions').innerHTML = '<span style="font-size:12px;color:var(--danger);font-weight:600;">✕ Denied</span>';
                await fetch('/api/approve', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ approval_id: ev.approval_id, approved: false }),
                });
              };
              turnToolsBox.insertBefore(appCard, statusLine);
            } else if (ev.type === 'state_updated') {
              if (ev.reset_view) {
                $('messagesInner').innerHTML = '';
              }
              loadState();
              loadCommands();
            } else if (ev.type === 'assistant_reply') {
              statusLine.remove();
              appendAssistantMessage(ev.content);
            } else if (ev.type === 'error') {
              statusLine.remove();
              appendAssistantMessage(`**Error:** ${ev.message}`);
            }
            scrollToBottom();
          }

          if (evData.done) break;
          await new Promise((r) => setTimeout(r, 350));
        }
      } catch (err) {
        statusLine.remove();
        appendAssistantMessage(`**Error:** ${err.message}`);
      } finally {
        state.isBusy = false;
        $('btnSend').disabled = false;
        loadState();
      }
    }

    $('btnSend').onclick = sendPrompt;

    // Slash Command & '@' File Mention Autocomplete Palette
    let slashCommands = [];
    let workspaceFiles = [];
    let acMatches = [];
    let acActiveIdx = 0;
    let acMode = null; // 'slash' | 'at'
    let acTokenRange = null;

    async function loadCommands() {
      try {
        const res = await fetch('/api/commands');
        const data = await res.json();
        slashCommands = data.commands || [];
      } catch (e) {}
    }

    async function loadMentionableFiles() {
      try {
        const res = await fetch('/api/workspace/files');
        const data = await res.json();
        workspaceFiles = data.files || [];
      } catch (e) {}
    }

    function closeSlashMenu() {
      $('slashMenu').classList.remove('open');
      acMatches = [];
      acActiveIdx = 0;
      acMode = null;
      acTokenRange = null;
    }

    function renderSlashMenu() {
      const inp = $('promptInput');
      const cursor = inp.selectionStart || 0;
      const beforeCursor = inp.value.slice(0, cursor);
      const menu = $('slashMenu');

      // 1. Check '@' file mention anywhere before cursor
      const atMatch = beforeCursor.match(/(?:^|\s)(@[^\s]*)$/);
      if (atMatch) {
        const token = atMatch[1];
        const query = token.slice(1).toLowerCase();
        acMode = 'at';
        acTokenRange = { start: cursor - token.length, end: cursor };
        acMatches = workspaceFiles
          .filter((f) => !query || f.path.toLowerCase().includes(query))
          .slice(0, 15)
          .map((f) => ({
            label: '@' + f.path,
            desc: f.size,
            cat: 'FILE',
            raw: f.path.includes(' ') ? `@"${f.path}"` : `@${f.path}`,
          }));
      } else if (inp.value.startsWith('/') && !inp.value.includes('\n') && !inp.value.includes(' ')) {
        // 2. Check '/' slash command at start
        const token = inp.value.toLowerCase();
        acMode = 'slash';
        acTokenRange = { start: 0, end: inp.value.length };
        acMatches = slashCommands
          .filter((c) => c.cmd.toLowerCase().startsWith(token))
          .slice(0, 12)
          .map((c) => ({ label: c.cmd, desc: c.desc, cat: c.cat, raw: c.cmd }));
      } else {
        closeSlashMenu();
        return;
      }

      if (acMatches.length === 0) {
        closeSlashMenu();
        return;
      }
      if (acActiveIdx >= acMatches.length) acActiveIdx = 0;
      menu.innerHTML = '';
      acMatches.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'slash-item' + (idx === acActiveIdx ? ' active' : '');
        row.innerHTML = `
          <span class="slash-cmd">${escapeHtml(item.label)}</span>
          <span class="slash-desc">${escapeHtml(item.desc)}</span>
          <span class="slash-cat">${escapeHtml(item.cat)}</span>
        `;
        row.onclick = () => applySlashSelection(item.raw);
        menu.appendChild(row);
      });
      menu.classList.add('open');
    }

    function applySlashSelection(cmdText) {
      const inp = $('promptInput');
      if (acMode === 'at' && acTokenRange) {
        const val = inp.value;
        const insertStr = cmdText + ' ';
        inp.value = val.slice(0, acTokenRange.start) + insertStr + val.slice(acTokenRange.end);
        const newPos = acTokenRange.start + insertStr.length;
        inp.setSelectionRange(newPos, newPos);
      } else {
        const baseCmd = cmdText.split(/\s+/)[0];
        const needsArg = cmdText.includes('<') || cmdText.includes('[');
        inp.value = needsArg ? baseCmd + ' ' : baseCmd;
      }
      closeSlashMenu();
      inp.focus();
    }

    $('promptInput').addEventListener('keydown', (e) => {
      const menuOpen = $('slashMenu').classList.contains('open');
      if (menuOpen) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          acActiveIdx = (acActiveIdx + 1) % acMatches.length;
          renderSlashMenu();
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          acActiveIdx = (acActiveIdx - 1 + acMatches.length) % acMatches.length;
          renderSlashMenu();
          return;
        }
        if (e.key === 'Tab') {
          e.preventDefault();
          if (acMatches[acActiveIdx]) applySlashSelection(acMatches[acActiveIdx].raw);
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          closeSlashMenu();
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey) {
          const topMatch = acMatches[acActiveIdx];
          if (acMode === 'at' && topMatch) {
            e.preventDefault();
            applySlashSelection(topMatch.raw);
            return;
          }
          const curVal = $('promptInput').value.trim();
          if (acMode === 'slash' && topMatch && curVal !== topMatch.raw.split(/\s+/)[0]) {
            e.preventDefault();
            applySlashSelection(topMatch.raw);
            return;
          }
          closeSlashMenu();
        }
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });
    $('promptInput').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 160) + 'px';
      renderSlashMenu();
    });

    // Settings handlers
    async function updateSetting(payload) {
      await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      await loadState();
      showToast('Settings updated');
    }

    $('selSafety').onchange = (e) => updateSetting({ safety_mode: e.target.value });
    $('selEffort').onchange = (e) => updateSetting({ effort: e.target.value });
    $('selLanguage').onchange = (e) => updateSetting({ language: e.target.value });
    $('selModel').onchange = (e) => updateSetting({ model: e.target.value });

    async function createNewSession() {
      await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'new_session' }),
      });
      await loadMessages();
      await loadState();
      closeMobileDrawer();
    }
    $('btnNewSession').onclick = createNewSession;
    $('btnClearView').onclick = createNewSession;

    // Initial boot
    loadState();
    loadFiles('');
    loadMessages();
    loadCommands();
    loadMentionableFiles();
  </script>
</body>
</html>
